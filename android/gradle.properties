# ---------------------------------------------------------------------------
# Memory (critical on ~8 GB RAM machines)
# ---------------------------------------------------------------------------
# A heap of 8G + 4G metaspace exceeds physical RAM and crashes the Gradle
# daemon with "Native memory allocation (mmap) failed" (see hs_err_*.log).
# Keep Gradle + Kotlin daemons modest so `flutter build apk` can finish.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# Fewer parallel compile workers = lower peak RAM (slower but stable).
org.gradle.parallel=false
org.gradle.workers.max=2

# Windows: fewer file watchers can avoid odd daemon issues.
org.gradle.vfs.watch=false

android.useAndroidX=true

# Optional: if you upgrade RAM, you can raise -Xmx (e.g. 4096m) and set
# org.gradle.parallel=true for faster builds.
